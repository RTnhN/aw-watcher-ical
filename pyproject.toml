[project]
name = "aw-watcher-ical"
version = "0.1.0"
description = "Synchronize private iCalendar feeds into ActivityWatch"
readme = "README.md"
authors = [
    { name = "Zach Strout", email = "zachstrout@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aw-client>=0.5.15,<0.6",
    "aw-core>=0.5.16,<0.6",
    "icalendar>=6,<8",
    "recurring-ical-events>=3.8,<4",
    "requests>=2.32,<3",
    "tzlocal>=5,<6",
    "filelock>=3.20,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
aw-watcher-ical = "aw_watcher_ical:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
